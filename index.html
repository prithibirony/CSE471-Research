<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Task Management System</h1>
<p>Manage your assignments and deadlines easily.</p>

<div class="task-form">
    <h2>Add a New Task</h2>

    <form id="taskForm">
        <label for="taskTitle">Task Name</label>
        <input
            type="text"
            id="taskTitle"
            placeholder="Enter assignment name"
            required
        >

        <label for="taskDeadline">Deadline</label>
        <input type="date" id="taskDeadline" required>

        <label for="taskCategory">Category</label>
        <select id="taskCategory">
            <option value="Assignment">Assignment</option>
            <option value="Exam">Exam</option>
            <option value="Project">Project</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit">Add Task</button>
    </form>
</div>
<div class="task-list">
    <h2>My Tasks</h2>

<div class="task-filter">
    <label for="filterTasks">Filter Tasks:</label>
    <select id="filterTasks">
        <option value="All">All Tasks</option>
        <option value="Pending">Pending Tasks</option>
        <option value="Completed">Completed Tasks</option>
    </select>
</div>

    <div id="taskList"></div>
</div>
<script src="script.js"></script>
</body>
<div class="interface-navigation">
    <a href="index.html">Interface A - Simple List</a>
    <a href="dashboard.html">Interface B - Dashboard</a>
</div>
</html>
